# nav2_params_spot.yaml
#
# Parametri Nav2 per Spot, adattati per il following reattivo SENZA mappa globale
# (nessun AMCL, nessun map_server) — navigazione puramente reattiva nel frame odom.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: odom #odom
    robot_base_frame: feet_center #body
    odom_topic: /odom
    default_nav_to_pose_bt_xml: "$(find-pkg-share spot_motion)/bt/follow_point.xml"

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker_plugins: ["progress_checker"]

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      stateful: True

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05    # Tolleranza per sensori a 2Hz: bastano 5 cm...
      movement_time_allowance: 15.0     # ...in 15 secondi per non far fallire la navigazione a vuoto.

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      publish_evaluation: True
      publish_cost_grid_pc: True
      publish_trajectory_pc: True
      marker_lifetime: 0.5
      max_vel_x: 0.6
      min_vel_x: 0.0                    # CORRETTO da 0.3: escludeva anche le traiettorie di pura
                                          # rotazione (vx=0), esattamente quelle che RotateToGoal
                                          # vuole proporre quando Spot non e' ancora rivolto verso
                                          # il goal — con min_vel_x=0.3 non potevano mai esistere
                                          # come candidati. Se serve SOLO marcia avanti (mai indietro),
                                          # questo lo garantisce gia' max_vel_x positivo e min_vel_x=0.0,
                                          # non serve alzare il minimo.
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 0.8
      min_vel_theta: -0.8
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      xy_goal_tolerance: 0.15
      vx_samples: 20
      vy_samples: 1                     # CORRETTO da 0: con 0 campioni su Y, il generatore di
                                          # traiettorie (XYThetaIterator, combinazione di
                                          # vx_samples x vy_samples x vtheta_samples) produceva
                                          # 20 x 0 x 40 = ZERO candidati totali — combacia esattamente
                                          # con l'errore "No valid trajectories out of 0!". Con 1
                                          # campione (a Y=0, dato min_vel_y=max_vel_y=0.0) si ottiene
                                          # comunque "nessun movimento laterale", senza azzerare tutto.
      vtheta_samples: 40
      trans_stopped_velocity: 0.05
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      RotateToGoal:
        scale: 5.0
        lookahead_time: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom #odom
      robot_base_frame: feet_center #body
      rolling_window: true
      transform_tolerance: 1.0
      transform_cache_timeout: 2.0
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.60, 0.35], [0.60, -0.35], [-0.60, -0.35], [-0.60, 0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: cam_frontleft cam_frontright 
        transform_tolerance: 1.0
        observation_persistence: 1.5
        cam_frontleft:
          topic: /depth/frontleft/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.12
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
        cam_frontright:
          topic: /depth/frontright/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.12
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
        cam_hand:
          topic: /depth/hand/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.18
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom #odom
      robot_base_frame: feet_center #body
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.60
      plugins: ["obstacle_layer", "inflation_layer"]
      transform_tolerance: 1.0 
      transform_cache_timeout: 2.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: cam_frontleft cam_frontright 
        transform_tolerance: 1.0
        observation_persistence: 1.5
        cam_frontleft:
          topic: /depth/frontleft/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.12
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
        cam_frontright:
          topic: /depth/frontright/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.12
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
        cam_hand:
          topic: /depth/hand/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.18
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    max_velocity: [0.3, 0.0, 0.5]
    min_velocity: [-0.3, 0.0, -0.5]

lifecycle_manager:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'velocity_smoother']