# nav2_params_spot_sim.yaml
#
# Parametri Nav2 per Spot in simulazione — navigazione reattiva nel frame odom,
# senza mappa globale (nessun AMCL, nessun map_server).
# Odometria: ground truth da Gazebo (/odom/ground_truth).
# Depth camera frontali collegate solo al costmap locale.
# robot_base_frame: "base_link" (base champ_base upstream).
#
# Per abilitare la traslazione laterale cercare i commenti [LATERALE].

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom/ground_truth

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.001   
    min_theta_velocity_threshold: 0.10

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.14
      stateful: True

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      # lookahead fisso: evita che a bassa velocita' il punto inseguito sia
      # troppo vicino e la regolazione in curva freni ulteriormente
      lookahead_dist: 1.0
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      # decelerazione progressiva in avvicinamento: inizia a 1.5 m dal goal
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 1.5
      # rallentamento in curva solo per curve strette
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.3
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.55, 0.28], [0.55, -0.28], [-0.55, -0.28], [-0.55, 0.28]]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: depth_left depth_right
        depth_left:
          topic: /frontleft_depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.40
          max_obstacle_height: 1.50
          obstacle_max_range: 1.5
          raytrace_max_range: 2.0
        depth_right:
          topic: /frontright_depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.40
          max_obstacle_height: 1.50
          obstacle_max_range: 1.5
          raytrace_max_range: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.55, 0.28], [0.55, -0.28], [-0.55, -0.28], [-0.55, 0.28]]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: depth_left depth_right
        depth_left:
          topic: /frontleft_depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.40
          max_obstacle_height: 1.50
          obstacle_max_range: 1.5
          raytrace_max_range: 2.0
        depth_right:
          topic: /frontright_depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.40
          max_obstacle_height: 1.50
          obstacle_max_range: 1.5
          raytrace_max_range: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 0.5]
    min_velocity: [-0.3, 0.0, -0.5]
    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]

lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'velocity_smoother']