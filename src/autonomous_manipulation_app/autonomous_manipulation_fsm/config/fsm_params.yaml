fsm_node:
  ros__parameters:
    # FSM timer frequency (Hz): every tick runs the handler of the current state
    rate: 10.0

    # ---------- dependencies ----------
    # YOLO detection service (yolo_detector/detector_node)
    detection_service: "detection"
    # Nav2 action (spot_motion/navigation_launch.py)
    navigate_action: "navigate_to_pose"
    # Manipulate action
    manipulate_action: "manipulation_custom"
    # MoveArmToPose action
    move_arm_action: "move_arm_to_pose"
    # OpenGripper service
    open_gripper_service: "open_gripper"
    # CloseGripper service
    close_gripper_service: "close_gripper"
    # Nav2 BT for the goal; empty = Nav2 default BT (navigate_to_pose_w_replanning_and_recovery.xml),
    # which ends with SUCCESS on arrival. Do NOT use spot_motion/bt/follow_point_spot.xml: it never ends.
    behavior_tree: ""

    # ---------- frames ----------
    # must match global_frame / robot_base_frame in spot_motion/config/nav2_params_spot_real.yaml
    global_frame: "odom"
    base_frame: "body"

    # ---------- 3D localization of the ball ----------
    # intrinsics of the camera the detection runs on
    camera_info_topic: "/camera/hand/camera_info"
    # depth registered to the hand color camera (same pixels as the detection)
    depth_topic: "/depth_registered/hand/image"

    # ---------- click fallback ----------
    # backup of the YOLO detection: if nothing is detected in detection_timeout, DETECT waits for a pixel
    # clicked (left button) on the yolo_detector window instead of going to ERROR
    # (needs show_image: true in detector_params.yaml); false = ERROR as before
    #   click_fallback_navigation: far detection -> the clicked pixel + depth is where the robot walks to
    #                              (standoff_distance away from it, facing it)
    #   click_fallback_pick:       near detection -> the clicked pixel is grasped by the Manipulate action
    click_fallback_navigation: true
    click_fallback_pick: true

    # ---------- operator OK ----------
    # before the robot moves (start of the cycle, navigation to the target, pick, place, return home) the
    # FSM waits for the operator's OK: a left click anywhere on the yolo_detector window (confirm_by_click),
    # Enter, or the /fsm_node/start service. The window shows what the FSM is waiting for.
    confirm_by_click: true
    # OK before the navigation to the detected target (not asked when the target was clicked by the operator)
    confirm_navigation: true
    # topic where the FSM publishes the request drawn on the yolo_detector window
    click_request_topic: "click_request"
    # topic of the clicked pixel (clicked_pixel_topic in detector_params.yaml)
    clicked_pixel_topic: "clicked_pixel"
    # half size (px) of the square around the clicked pixel used to read the depth
    click_depth_window: 5
    # seconds to wait for a click (fallback or confirmation) before going to ERROR (0 = wait forever)
    click_timeout: 120.0

    # ---------- navigation ----------
    # distance (m) between robot body and ball at the end of the navigation
    standoff_distance: 0.8
    # if the robot is already within standoff_distance + min_nav_distance (m) it does not navigate
    # (Nav2 xy_goal_tolerance is 0.30)
    min_nav_distance: 0.3

    # ---------- timeouts (s) ----------
    detection_timeout: 15.0
    # every detection (far and near) must be confirmed by the operator with a click on the ball in the
    # yolo_detector window; confirmation_timeout replaces detection_timeout while waiting for the click
    require_operator_confirmation: true
    confirmation_timeout: 120.0
    # near detection: pick at the pixel clicked by the operator instead of the bbox center
    pick_at_click_point: true
    # pixel sent to Manipulation, shown by yolo_detector in its "pick target" window
    pick_target_topic: "/fsm_node/pick_target"
    navigation_timeout: 60.0

    # read Enter from the terminal to start (works with ros2 run and ros2 launch);
    # the /fsm_node/start service always works too
    use_stdin: true

    # --------- Detection Poses ----------
    far_detection_pose:
      position:
        x: 0.602
        y: 0.010
        z: 0.225
      orientation:
        x: -0.021
        y: 0.194
        z: 0.020
        w: 0.981

    near_detection_pose:
      position:
        x: 0.498
        y: -0.004
        z: 0.236
      orientation:
        x: 0.006
        y: 0.478
        z: -0.018
        w: 0.878

    # --------- place (NAVIGATE_TO_PLACE) ----------
    # arm poses recorded with: ros2 run manipulation_interfaces save_arm_pose.py
    arm_poses_file: "/home/spot_ws/src/autonomous_manipulation_app/arm_poses.yaml"
    # poses of arm_poses_file commanded in order, then the gripper is opened
    place_arm_sequence: ["safe", "post_pick_1", "post_pick_2", "pre_place_1", "pre_place_2", "pre_open_gripper"]
    open_gripper_timeout: 10.0
    # after opening: wait (s) for the object to drop, close the gripper, then stow the arm
    place_release_delay: 1.0
    # optional poses commanded before the stow, e.g. ["pre_place_1", "safe"]; [""] = stow directly
    post_place_arm_sequence: [""]

    # --------- end of cycle ----------
    # after the place the robot goes back to the initial position (saved when the cycle starts) and sits;
    # it stands up again when the next cycle is started
    sit_service: "sit"
    stand_service: "stand"
    posture_timeout: 15.0
    # final in-place turn to the start orientation (Nav2 accepts any heading), via cmd_vel
    align_home_yaw: true
    cmd_vel_topic: "/cmd_vel"
    align_yaw_tolerance: 0.087     # rad (~5 deg)
    align_gain: 1.0                # rad/s per rad of error
    align_max_angular_vel: 0.5     # rad/s
    align_min_angular_vel: 0.15    # rad/s
    align_timeout: 20.0            # s
    # before the return navigation: turn in place towards the initial position (no large curve);
    # skipped when closer than face_goal_min_distance (m)
    face_goal_before_navigation: true
    face_goal_min_distance: 0.5

    # --------- lease ----------
    # spot_driver claim service called in the constructor (needed with auto_claim: False in spot.yaml)
    claim_service: "claim"
    claim_timeout: 10.0
    # claim the lease again before every arm move and every navigation
    claim_before_motion: true

    # --------- shutdown ----------
    # Trigger service called on Ctrl+C / SIGTERM from any state to reset the arm (spot_driver)
    arm_reset_service: "arm_stow"
    # Trigger service called before every navigation to stow the arm, and its timeout (s)
    arm_stow_service: "arm_stow"
    arm_stow_timeout: 10.0
    # max time (s) to wait for the arm reset; keep it below sigterm_timeout in fsm_launch.py
    shutdown_timeout: 7.0
