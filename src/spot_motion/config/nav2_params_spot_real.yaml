# nav2_params_spot_real.yaml
#
# Nav2 parameters for the REAL Spot — reactive navigation in the odom frame,
# no global map (no AMCL, no map_server).
#
# Where the parameters come from (sim + real merge):
#   - Behavior Tree, controller (Regulated Pure Pursuit), planner, goal/progress
#     checker, velocity_smoother, lifecycle: taken from nav2_params_spot_sim.yaml
#     (the configuration verified in simulation).
#   - Costmap (sources, heights, footprint, TF tolerances): taken from the old
#     nav2_params_spot_real.yaml (spot_ros2 topics and frames).
#   - Changes specific to the real robot: marked with [REAL].
#
# Prerequisites:
#   - spot_ros2 driver running
#   - depth_launch.py (spot_motion) running: converts /depth/<cam>/image into
#     /depth/<cam>/points, the only format accepted by the obstacle_layer.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    # [REAL] 'body' always exists in the spot_ros2 TF tree. If you prefer
    # 'feet_center', check it first: ros2 run tf2_ros tf2_echo odom feet_center
    # and replace it in ALL the robot_base_frame entries of this file.
    robot_base_frame: body
    # [REAL] check the name with: ros2 topic list | grep -i odom
    odom_topic: /odom
    # default_nav_to_pose_bt_xml is passed in by navigation_launch.py

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.10

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      # any final orientation. A tight value (e.g. 0.15) needs use_rotate_to_heading: true, which
      # blocked the return home (the robot could not do the ~180 deg in-place turn at the start)
      yaw_goal_tolerance: 3.14
      stateful: True

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # [REAL] 1.0 m/s in sim; on the real robot, close to people, start
      # conservatively. Raise it after the first tests (together with velocity_smoother).
      desired_linear_vel: 0.83
      lookahead_dist: 0.9
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.2
      use_velocity_scaled_lookahead_dist: false
      # [REAL] TF over WiFi has more latency than the simulation (was 0.2).
      transform_tolerance: 0.5
      # [REAL] In sim this was 0.4 because below that speed the CHAMP gait
      # walked in place. The real Spot handles low speeds well, so this way
      # it really slows down when approaching and in curves.
      min_approach_linear_velocity: 0.25
      approach_velocity_scaling_dist: 0.9
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.25
      # In the sim file this key appeared TWICE (true, then false).
      # Here it appears once, with the value of the last occurrence.
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.8
      cost_scaling_gain: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      # false: with true the robot has to turn in place towards the path at the start (> 45 deg) and
      # towards the goal heading at the end; the ~180 deg turn of the return home never started
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: body
      rolling_window: true
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 1.0
      width: 6
      height: 6
      resolution: 0.05
      # Footprint of the real robot WITH the arm stretched forward (hand camera).
      # The narrow "nose" covers arm and gripper: the front cameras see them, and
      # the cells inside the footprint are cleared (footprint_clearing_enabled, default true).
      # 1.05 = hand overhang + ~10 cm: MEASURE IT with
      #   ros2 run tf2_ros tf2_echo body hand     (x of the translation)
      # and update the value here AND in the global_costmap.
      footprint: "[[0.60, 0.35], [1.05, 0.15], [1.05, -0.15], [0.60, -0.35], [-0.60, -0.35], [-0.60, 0.35]]"
      always_send_full_costmap: true
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # layer-level height filter (default 2.0, in odom): wide like the sources, the scan points
        # sit at the flat_body height in odom, which drifts
        max_obstacle_height: 10.0
        # Sources = LaserScans made by launch/depth_launch.py from the front clouds, in
        # flat_body: the floor is cut out THERE, so the odom drift in z no longer turns
        # the floor into obstacles. The obstacle height band is set in depth_launch.py
        # (min_height / max_height), NOT here: min/max_obstacle_height below are wide
        # on purpose (the scan points sit at the flat_body height in odom, which drifts).
        # 'inf' beams (no return) clear the whole beam up to raytrace_max_range:
        # this is the continuous refresh the old clear_* sources did with the floor rays.
        observation_sources: scan_frontleft scan_frontright
        scan_frontleft:
          topic: /scan/frontleft
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
        scan_frontright:
          topic: /scan/frontright
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Same as in simulation. With 0.40 (old real value) the cost vanished almost
        # right past the inscribed radius (0.35): the planner grazed the obstacles
        # and the footprint corners / the arm ended up in lethal cells
        # -> "RegulatedPurePursuitController detected collision ahead!".
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: body
      rolling_window: true
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 1.0
      # 16 m instead of 10: margin for distant goals (target up to ~4.5 m).
      width: 16
      height: 16
      resolution: 0.05
      footprint: "[[0.60, 0.35], [1.05, 0.15], [1.05, -0.15], [0.60, -0.35], [-0.60, -0.35], [-0.60, 0.35]]"
      always_send_full_costmap: true
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # layer-level height filter (default 2.0, in odom): wide like the sources, the scan points
        # sit at the flat_body height in odom, which drifts
        max_obstacle_height: 10.0
        # Sources = LaserScans made by launch/depth_launch.py from the front clouds, in
        # flat_body: the floor is cut out THERE, so the odom drift in z no longer turns
        # the floor into obstacles. The obstacle height band is set in depth_launch.py
        # (min_height / max_height), NOT here: min/max_obstacle_height below are wide
        # on purpose (the scan points sit at the flat_body height in odom, which drifts).
        # 'inf' beams (no return) clear the whole beam up to raytrace_max_range:
        # this is the continuous refresh the old clear_* sources did with the floor rays.
        observation_sources: scan_frontleft scan_frontright
        scan_frontleft:
          topic: /scan/frontleft
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
        scan_frontright:
          topic: /scan/frontright
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Same as in simulation. With 0.40 (old real value) the cost vanished almost
        # right past the inscribed radius (0.35): the planner grazed the obstacles
        # and the footprint corners / the arm ended up in lethal cells
        # -> "RegulatedPurePursuitController detected collision ahead!".
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    # same frames as the costmaps (the Nav2 defaults are odom / base_link): spin and backup measure
    # the motion done on TF global_frame -> robot_base_frame
    global_frame: odom
    robot_base_frame: body
    # default 0.1 s: under load the TF arrives later and the behaviors lose the robot pose
    transform_tolerance: 0.5
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    # [REAL] same limit as desired_linear_vel (was 1.0 in sim)
    max_velocity: [0.9, 0.0, 0.6]
    min_velocity: [-0.3, 0.0, -0.6]
    max_accel: [1.2, 0.0, 1.2]
    max_decel: [-1.2, 0.0, -1.2]

lifecycle_manager:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'velocity_smoother']